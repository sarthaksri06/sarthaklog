<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 100%;
    max-width: 360px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 25px;
}

.card {
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 30px;
    text-align: left;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 500;
}

.input-group {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: black;
}

button {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #222;
}

.switch {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.switch a {
    color: black;
    font-weight: 500;
    cursor: pointer;
}

.forgot-password {
    text-align: right;
    margin-top: 5px;
    margin-bottom: 15px;
}

.forgot-password a {
    color: #666;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
}

.forgot-password a:hover {
    color: black;
    text-decoration: underline;
}

#nameGroup {
    display: none;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background-color: white;
    margin: 20% auto;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    position: relative;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 24px;
    cursor: pointer;
    color: #999;
}

.close:hover {
    color: black;
}

.modal h3 {
    margin-bottom: 20px;
}

.modal input {
    margin-bottom: 20px;
}

.modal button {
    margin-top: 0;
}
</style>
</head>
<body>

<div class="container">
    <div class="logo">Create An Account</div>
    <div class="card">
        <h2 id="title">Log in</h2>
        <form id="authForm">
            <div id="nameGroup" class="input-group">
                <input type="text" id="fullname" placeholder="Full name">
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="forgot-password">
                <a onclick="openForgotModal()">Forgot password?</a>
            </div>
            <button type="submit" id="submitBtn">Continue</button>
            <div class="switch">
                <span id="switchText">Don't have an account?</span>
                <a id="toggleMode">Sign up</a>
            </div>
        </form>
    </div>
</div>

<div id="forgotModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeForgotModal()">&times;</span>
        <h3>Reset Password</h3>
        <p style="margin-bottom: 15px; font-size: 14px; color: #666;">Enter your email to receive reset instructions</p>
        <input type="email" id="resetEmail" placeholder="Email address" style="width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 6px;">
        <button onclick="sendResetLink()" style="margin-top: 10px;">Send Reset Link</button>
    </div>
</div>

<script>
const form = document.getElementById('authForm');
const toggleMode = document.getElementById('toggleMode');
const title = document.getElementById('title');
const nameGroup = document.getElementById('nameGroup');
const switchText = document.getElementById('switchText');
const submitBtn = document.getElementById('submitBtn');

let isLogin = true;

function openForgotModal() {
    document.getElementById('forgotModal').style.display = 'block';
}

function closeForgotModal() {
    document.getElementById('forgotModal').style.display = 'none';
    document.getElementById('resetEmail').value = '';
}

async function sendResetLink() {
    const email = document.getElementById('resetEmail').value;
    
    if (!email) {
        alert('Please enter your email address');
        return;
    }
    
    try {
        const response = await fetch('/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        alert(data.message);
        closeForgotModal();
    } catch (err) {
        alert('Server error. Please try again.');
    }
}

window.onclick = function(event) {
    const modal = document.getElementById('forgotModal');
    if (event.target === modal) {
        closeForgotModal();
    }
}

toggleMode.addEventListener('click', () => {
    isLogin = !isLogin;

    if (isLogin) {
        title.textContent = "Log in";
        nameGroup.style.display = "none";
        switchText.textContent = "Don't have an account?";
        toggleMode.textContent = "Sign up";
    } else {
        title.textContent = "Sign up";
        nameGroup.style.display = "block";
        switchText.textContent = "Already have an account?";
        toggleMode.textContent = "Log in";
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const endpoint = isLogin ? '/login' : '/signup';

    const payload = isLogin
        ? {
            email: email.value,
            password: password.value
        }
        : {
            fullname: fullname.value,
            email: email.value,
            password: password.value
        };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';

    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
            alert(data.message);
            
            if (!isLogin) {
                setTimeout(() => {
                    isLogin = true;
                    title.textContent = "Log in";
                    nameGroup.style.display = "none";
                    switchText.textContent = "Don't have an account?";
                    toggleMode.textContent = "Sign up";
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                    alert("Account created. Please login");
                }, 1000);
            } else {
                window.location.href = '/dashboard';
            }
        } else {
            alert(data.message);
        }
    } catch (err) {
        alert("Server not running");
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLogin ? 'Continue' : 'Sign Up';
    }
});
</script>
</body>
</html>
